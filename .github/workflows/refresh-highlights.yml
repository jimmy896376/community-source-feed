name: Refresh major highlight candidates

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-feed
  cancel-in-progress: false

jobs:
  refresh-highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/highlights_feed.py
      - name: Save candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add highlights.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh major highlight candidates'
          git push
