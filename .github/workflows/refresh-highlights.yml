name: Refresh major highlight candidates

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'automation/highlights_feed.py'
      - 'automation/test_highlights_feed.py'
      - '.github/workflows/refresh-highlights.yml'

permissions:
  contents: write

concurrency:
  group: source-feed
  cancel-in-progress: false

jobs:
  refresh-highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/test_highlights_feed.py
      - run: python automation/highlights_feed.py
      - name: Save changed candidates
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          old = json.loads(subprocess.check_output(["git", "show", "HEAD:highlights.json"]))
          new = json.loads(Path("highlights.json").read_text())
          if old.get("videos") == new.get("videos"):
              subprocess.run(["git", "restore", "--", "highlights.json"], check=True)
          PY
          git add highlights.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh major highlight candidates'
          git push
