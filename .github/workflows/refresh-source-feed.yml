name: Refresh public source feed

on:
  push:
    paths:
      - '.github/workflows/refresh-source-feed.yml'
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - run: python -m unittest discover -s automation -p 'test_*.py'
      - run: python -m playwright install chromium
      - name: Collect source feed and images
        env:
          SOURCE_MEDIA_CACHE_DIR: ${{ runner.temp }}/source-media-cache
        run: python automation/source_feed.py
      - name: Publish approved source image cache
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MEDIA_CACHE_DIR: ${{ runner.temp }}/source-media-cache
        run: |
          if ! gh release view source-media-cache >/dev/null 2>&1; then
            gh release create source-media-cache --title 'Public source media cache' --notes 'Approved public source images for the posting feed.'
          fi
          gh release view source-media-cache --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-media.txt"
          files=()
          for file in "$SOURCE_MEDIA_CACHE_DIR"/*; do
            [ -f "$file" ] || continue
            name=${file##*/}
            if ! grep -Fxq "$name" "$RUNNER_TEMP/existing-media.txt"; then
              files+=("$file")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            gh release upload source-media-cache "${files[@]}"
          fi
      - run: python automation/highlights_feed.py
      - name: Save feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json highlights.json
          git commit -m 'Refresh public source feeds' || exit 0
          git pull --rebase -X theirs origin main
          git push
      - name: Prune expired source image cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/prune_media_cache.py
